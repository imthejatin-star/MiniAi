name: Process Study Material

on:
  workflow_dispatch:
  push:
    paths:
      - "study_input.txt"
      - "study_processor.py"
      - ".github/workflows/study.yml"

permissions:
  contents: write

jobs:
  process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Process study material
        run: |
          python study_processor.py

      - name: Save generated study data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add www/study_data.json
          git diff --cached --quiet || git commit -m "Update generated study material"
          git push
