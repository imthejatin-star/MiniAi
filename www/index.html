<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>MiniAI</title>

<script src="ort.min.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#080b12;
  color:#f5f7fb;
  font-family:Arial,sans-serif;
  min-height:100vh;
}

.app{
  width:100%;
  max-width:700px;
  margin:auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  padding:24px 20px 16px;
  border-bottom:1px solid #1b2230;
}

.logo{
  font-size:25px;
  font-weight:800;
}

.status{
  margin-top:6px;
  color:#8d97a8;
  font-size:13px;
}

#chat{
  flex:1;
  padding:20px;
  overflow-y:auto;
}

.message{
  max-width:88%;
  padding:13px 15px;
  margin-bottom:14px;
  border-radius:16px;
  line-height:1.5;
  font-size:15px;
  white-space:pre-wrap;
  word-wrap:break-word;
}

.ai{
  background:#121925;
  border:1px solid #1e2838;
  margin-right:auto;
}

.user{
  background:#26344b;
  margin-left:auto;
}

.empty{
  height:100%;
  min-height:55vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#707b8d;
  padding:30px;
}

.empty h1{
  color:#e9edf5;
  font-size:28px;
  margin-bottom:10px;
}

.empty p{
  line-height:1.6;
}

.input-area{
  padding:12px 15px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid #1b2230;
  background:#080b12;
  display:flex;
  gap:9px;
}

#input{
  flex:1;
  min-width:0;
  resize:none;
  border:1px solid #263044;
  outline:none;
  border-radius:15px;
  padding:13px 14px;
  background:#111722;
  color:white;
  font-size:15px;
  font-family:inherit;
  max-height:130px;
}

#input:focus{
  border-color:#465675;
}

#send{
  width:48px;
  height:48px;
  border:0;
  border-radius:14px;
  background:#f5f7fb;
  color:#080b12;
  font-size:19px;
  font-weight:bold;
  align-self:flex-end;
}

#send:active{
  transform:scale(.95);
}

#send:disabled{
  opacity:.4;
}
#studyNav{
  display:flex;
  border-bottom:1px solid #1b2230;
  background:#080b12;
}

#studyNav button{
  flex:1;
  padding:14px;
  border:0;
  background:transparent;
  color:#9ba6b8;
  font-weight:bold;
}

#study{
  flex:1;
  overflow-y:auto;
}

.study-card{
  background:#121925;
  border:1px solid #1e2838;
  border-radius:16px;
  padding:16px;
  margin:12px 0;
  line-height:1.55;
}

#study h1{
  margin-top:0;
}

#study h2{
  margin-top:25px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">MiniAI</div>
  <div class="status" id="status">Loading neural brain...</div>
</header>
<nav id="studyNav">
  <button onclick="showStudySection('chat')">AI</button>
  <button onclick="showStudySection('study')">Study</button>
</nav>

<section id="study" style="display:none; padding:20px;">

  <h1 id="studyTitle">Study</h1>

  <div id="studyContent"></div>

</section>
<main id="chat">

  <div class="empty" id="empty">
    <div>
      <h1>MiniAI</h1>
      <p>
        A tiny neural language model<br>
        running locally on your device.
      </p>
    </div>
  </div>

</main>

<div class="input-area">

  <textarea
    id="input"
    rows="1"
    placeholder="Ask MiniAI something..."
  ></textarea>

  <button id="send" disabled>↑</button>

</div>

</div>

<script>

let session = null;
let stoi = {};
let itos = {};
let modelConfig = null;

const chat = document.getElementById("chat");
const input = document.getElementById("input");
const send = document.getElementById("send");
const statusText = document.getElementById("status");
const empty = document.getElementById("empty");


/* ============================================================
   CONFIG
   ============================================================ */

const UNK = "<UNK>";

const MAX_INPUT_TOKENS = 48;
const MAX_GENERATED_TOKENS = 60;

const TEMPERATURE = 0.85;

const TOP_K = 20;


/* ============================================================
   TOKENIZER
   ============================================================ */

function tokenize(text){

  return text
    .toLowerCase()
    .match(/\w+|[^\w\s]/g) || [];

}


/* ============================================================
   LOAD VOCABULARY
   ============================================================ */

async function loadVocabulary(){

  const response =
    await fetch("vocab.json");

  if(!response.ok){

    throw new Error(
      "vocab.json could not be loaded."
    );

  }

  const data =
    await response.json();

  stoi =
    data.stoi || {};

  itos =
    data.itos || {};

}


/* ============================================================
   LOAD MODEL
   ============================================================ */

async function loadModel(){

  if(typeof ort === "undefined"){

    throw new Error(
      "ONNX Runtime failed to load."
    );

  }

  /*
    Keep WASM files next to the application.
  */

  ort.env.wasm.wasmPaths = "./";

  session =
    await ort.InferenceSession.create(
      "model.onnx",
      {
        executionProviders: ["wasm"],
        graphOptimizationLevel: "all"
      }
    );

}


/* ============================================================
   LOAD CONFIG
   ============================================================ */

async function loadConfig(){

  /*
    The model configuration is stored
    separately so the browser knows
    the model context length.
  */

  const response =
    await fetch("model_config.json");

  if(!response.ok){

    throw new Error(
      "model_config.json could not be loaded."
    );

  }

  modelConfig =
    await response.json();

}


/* ============================================================
   INITIALIZE
   ============================================================ */

async function initialize(){

  try{

    statusText.textContent =
      "Loading vocabulary...";

    await loadVocabulary();


    statusText.textContent =
      "Loading neural brain...";

    await loadConfig();

    await loadModel();


    const vocabularySize =
      Object.keys(stoi).length;


    statusText.textContent =
      "Neural brain ready • " +
      vocabularySize.toLocaleString() +
      " tokens";


    send.disabled = false;

    input.focus();


  }catch(error){

    console.error(error);

    statusText.textContent =
      "Brain failed to load";

    addMessage(
      "I couldn't load my neural model. " +
      "The model files may not have been built yet.",
      "ai"
    );

  }

}


/* ============================================================
   SOFTMAX
   ============================================================ */

function softmax(values){

  let max =
    Math.max(...values);

  let exponentials =
    values.map(
      value =>
        Math.exp(value - max)
    );

  let sum =
    exponentials.reduce(
      (a,b) => a + b,
      0
    );

  return exponentials.map(
    value =>
      value / sum
  );

}


/* ============================================================
   RANDOM SAMPLE
   ============================================================ */

function sample(probabilities){

  let random =
    Math.random();

  let cumulative = 0;

  for(
    let i = 0;
    i < probabilities.length;
    i++
  ){

    cumulative +=
      probabilities[i];

    if(random <= cumulative){

      return i;

    }

  }

  return probabilities.length - 1;

}


/* ============================================================
   TOP-K SAMPLING
   ============================================================ */

function topKSample(logits){

  const indexed =
    logits.map(
      (value,index) => ({
        value,
        index
      })
    );


  indexed.sort(
    (a,b) =>
      b.value - a.value
  );


  const selected =
    indexed.slice(
      0,
      Math.min(
        TOP_K,
        indexed.length
      )
    );


  const values =
    selected.map(
      item =>
        item.value / TEMPERATURE
    );


  const probabilities =
    softmax(values);


  const selectedIndex =
    sample(probabilities);


  return selected[
    selectedIndex
  ].index;

}


/* ============================================================
   MODEL PREDICTION
   ============================================================ */


  async function predict(inputIds){

  if(!session){
    throw new Error("Model is not loaded.");
  }

  const blockSize =
    Number(modelConfig.block_size);

  const unkId =
    Number(stoi["<UNK>"] ?? 1);

  /*
    Keep only the most recent tokens.
  */

  let context =
    inputIds.slice(-blockSize);

  /*
    Pad the beginning of the sequence.

    The model always receives exactly
    BLOCK_SIZE tokens.
  */

  if(context.length < blockSize){

    const padding =
      new Array(
        blockSize - context.length
      ).fill(unkId);

    context =
      padding.concat(context);
  }

  const tensor =
    new ort.Tensor(
      "int64",
      BigInt64Array.from(
        context,
        Number
      ),
      [
        1,
        blockSize
      ]
    );

  const results =
    await session.run({
      input_ids: tensor
    });

  const output =
    results.logits;

  const vocabularySize =
    output.dims[
      output.dims.length - 1
    ];

  /*
    We want the prediction at the
    final position of the sequence.
  */

  const lastPosition =
    blockSize - 1;

  const start =
    lastPosition * vocabularySize;

  return Array.from(
    output.data.slice(
      start,
      start + vocabularySize
    )
  );
  }


/* ============================================================
   GENERATE TEXT
   ============================================================ */

async function generateAnswer(question){

  if(!session){

    return "My neural brain isn't ready yet.";

  }


  const words =
    tokenize(question);


  if(words.length === 0){

    return "Please ask me something.";

  }


  let ids =
    words.map(
      word =>
        stoi[word] ??
        stoi[UNK]
    );


  /*
    Remove invalid tokens.
  */

  ids =
    ids.filter(
      id =>
        Number.isInteger(id)
    );


  if(ids.length === 0){

    return "I don't recognize those words yet.";

  }


  /*
    Limit the prompt length.
  */

  ids =
    ids.slice(
      -MAX_INPUT_TOKENS
    );


  const generated = [];


  for(
    let i = 0;
    i < MAX_GENERATED_TOKENS;
    i++
  ){

  
const logits =
  await predict(ids);

    const nextId =
      topKSample(logits);


    ids.push(nextId);


    const token =
      itos[String(nextId)];


    if(
      !token ||
      token === "<PAD>"
    ){

      continue;

    }


    generated.push(token);


    /*
      Stop at natural sentence endings
      after generating enough text.
    */

    if(
      generated.length >= 8 &&
      [".","!","?"].includes(token)
    ){

      break;

    }

  }


  return formatTokens(
    generated
  );

}


/* ============================================================
   FORMAT GENERATED TOKENS
   ============================================================ */

function formatTokens(tokens){

  let result = "";


  for(
    const token of tokens
  ){

    if(
      [".",",","!","?",";",":"].includes(token)
    ){

      result += token;

    }else{

      if(result.length > 0){

        result += " ";

      }

      result += token;

    }

  }


  if(result.length === 0){

    return "I couldn't generate an answer.";

  }


  return (
    result.charAt(0).toUpperCase() +
    result.slice(1)
  );

}


/* ============================================================
   ADD MESSAGE
   ============================================================ */

function addMessage(
  text,
  type
){

  if(empty){

    empty.remove();

  }


  const message =
    document.createElement(
      "div"
    );


  message.className =
    "message " + type;


  message.textContent =
    text;


  chat.appendChild(
    message
  );


  chat.scrollTop =
    chat.scrollHeight;

}


/* ============================================================
   SEND MESSAGE
   ============================================================ */

async function sendMessage(){

  const text =
    input.value.trim();


  if(
    !text ||
    !session
  ){

    return;

  }


  addMessage(
    text,
    "user"
  );


  input.value = "";

  input.style.height =
    "auto";


  send.disabled = true;


  try{

    const answer =
      await generateAnswer(
        text
      );


    addMessage(
      answer,
      "ai"
    );


  }catch(error){

    console.error(error);

    addMessage(
      "Something went wrong while generating the response.",
      "ai"
    );

  }


  send.disabled = false;

  input.focus();

}


/* ============================================================
   EVENTS
   ============================================================ */

send.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);


input.addEventListener(
  "input",
  () => {

    input.style.height =
      "auto";

    input.style.height =
      Math.min(
        input.scrollHeight,
        130
      ) + "px";

  }
);


/* ============================================================
   START
   ============================================================ */

initialize();

</script>
<script>
async function loadStudyMaterial() {
    try {
        const response = await fetch("study_data.json");

        if (!response.ok) {
            throw new Error("Study data not found");
        }

        const data = await response.json();

        console.log("Study material loaded:", data);

        /*
         * The study data is now available to the app.
         * We will build the actual Study screen next.
         */

        window.MiniAIStudyData = data;

    } catch (error) {
        console.log("No study material available yet.");
    }
}

loadStudyMaterial();
  function showStudySection(section){

  const chat = document.getElementById("chat");
  const study = document.getElementById("study");
  const inputArea = document.querySelector(".input-area");

  if(section === "study"){

    chat.style.display = "none";
    study.style.display = "block";
    inputArea.style.display = "none";

    renderStudy();

  }else{

    chat.style.display = "block";
    study.style.display = "none";
    inputArea.style.display = "flex";

  }

}


function renderStudy(){

  const data =
    window.MiniAIStudyData;

  const container =
    document.getElementById("studyContent");

  if(!data){

    container.innerHTML = `
      <p>
        No study material has been generated yet.
      </p>
    `;

    return;

  }


  let html = "";


  html += `
    <h2>Key Points</h2>
    <div class="study-card">
  `;

  for(const point of data.key_points || []){

    html += `
      <p>• ${escapeStudyHTML(point)}</p>
    `;

  }

  html += `
    </div>

    <h2>Flashcards</h2>
  `;


  for(const card of data.flashcards || []){

    html += `
      <div class="study-card">
        <strong>
          ${escapeStudyHTML(card.front)}
        </strong>

        <p>
          ${escapeStudyHTML(card.back)}
        </p>
      </div>
    `;

  }


  html += `
    <h2>Questions</h2>
  `;


  for(const question of data.questions || []){

    html += `
      <div class="study-card">
        <strong>
          ${escapeStudyHTML(question.question)}
        </strong>

        <p>
          ${escapeStudyHTML(question.answer)}
        </p>
      </div>
    `;

  }


  html += `
    <h2>Quiz</h2>
    <div id="quizContainer"></div>
  `;


  container.innerHTML = html;

  renderQuiz(
    data.quiz || []
  );

}


function renderQuiz(questions){

  const container =
    document.getElementById("quizContainer");

  if(!questions.length){

    container.innerHTML =
      "<p>No quiz questions available.</p>";

    return;

  }


  let html = "";

  questions.forEach(
    (question, index) => {

      html += `
        <div class="study-card">

          <strong>
            ${index + 1}.
            ${escapeStudyHTML(
              question.question
            )}
          </strong>
      `;


      question.options.forEach(
        option => {

          html += `
            <label style="
              display:block;
              margin:12px 0;
            ">

              <input
                type="radio"
                name="quiz-${index}"
                value="${escapeAttribute(option)}"
              >

              ${escapeStudyHTML(option)}

            </label>
          `;

        }
      );


      html += `
        </div>
      `;

    }
  );


  html += `
    <button
      onclick="checkQuiz()"
      style="
        width:100%;
        padding:15px;
        border:0;
        border-radius:14px;
        font-weight:bold;
      "
    >
      Check Answers
    </button>

    <div
      id="quizResult"
      style="margin-top:20px;"
    ></div>
  `;


  container.innerHTML =
    html;

}


function checkQuiz(){

  const data =
    window.MiniAIStudyData;

  if(!data || !data.quiz){

    return;

  }


  let score = 0;


  data.quiz.forEach(
    (question, index) => {

      const selected =
        document.querySelector(
          `input[name="quiz-${index}"]:checked`
        );


      if(
        selected &&
        selected.value.toLowerCase() ===
        question.answer.toLowerCase()
      ){

        score++;

      }

    }
  );


  const result =
    document.getElementById(
      "quizResult"
    );


  result.innerHTML = `
    <div class="study-card">
      <h2>
        Score: ${score}/${data.quiz.length}
      </h2>

      <p>
        ${
          score === data.quiz.length
          ? "Excellent!"
          : "Review the material and try again."
        }
      </p>
    </div>
  `;

}


function escapeStudyHTML(value){

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function escapeAttribute(value){

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll('"', "&quot;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;");

      }
      </script>
</body>
</html>
