<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>MiniAI Study</title>

<script src="ort.min.js"></script>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
  background:#080b12;
  color:#f5f7fb;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
}

button,
textarea,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:700px;
  margin:auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  background:#080b12;
}

header{
  padding:24px 20px 16px;
  border-bottom:1px solid #1b2230;
}

.logo{
  font-size:25px;
  font-weight:800;
  letter-spacing:-.5px;
}

.status{
  margin-top:6px;
  color:#8d97a8;
  font-size:13px;
}

#studyNav{
  display:flex;
  border-bottom:1px solid #1b2230;
  background:#080b12;
  position:sticky;
  top:0;
  z-index:20;
}

#studyNav button{
  flex:1;
  padding:15px;
  border:0;
  background:transparent;
  color:#9ba6b8;
  font-size:14px;
  font-weight:700;
}

#studyNav button:active{
  background:#121925;
}

#chat{
  flex:1;
  padding:20px;
  overflow-y:auto;
}

.message{
  max-width:88%;
  padding:13px 15px;
  margin-bottom:14px;
  border-radius:16px;
  line-height:1.5;
  font-size:15px;
  white-space:pre-wrap;
  word-wrap:break-word;
}

.ai{
  background:#121925;
  border:1px solid #1e2838;
  margin-right:auto;
}

.user{
  background:#26344b;
  margin-left:auto;
}

.empty{
  min-height:55vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#707b8d;
  padding:30px;
}

.empty h1{
  color:#e9edf5;
  font-size:28px;
  margin-bottom:10px;
}

.empty p{
  line-height:1.6;
}

.input-area{
  padding:12px 15px calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid #1b2230;
  background:#080b12;
  display:flex;
  gap:9px;
}

#input{
  flex:1;
  min-width:0;
  resize:none;
  border:1px solid #263044;
  outline:none;
  border-radius:15px;
  padding:13px 14px;
  background:#111722;
  color:white;
  font-size:15px;
  font-family:inherit;
  max-height:130px;
}

#input:focus{
  border-color:#465675;
}

#send{
  width:48px;
  height:48px;
  border:0;
  border-radius:14px;
  background:#f5f7fb;
  color:#080b12;
  font-size:19px;
  font-weight:bold;
  align-self:flex-end;
}

#send:active{
  transform:scale(.95);
}

#send:disabled{
  opacity:.4;
}

#study{
  flex:1;
  overflow-y:auto;
  padding:20px 20px 40px;
}

.study-card{
  background:#121925;
  border:1px solid #1e2838;
  border-radius:16px;
  padding:16px;
  margin:12px 0;
  line-height:1.55;
}

#study h1{
  margin:0 0 20px;
  font-size:26px;
}

#study h2{
  margin:25px 0 10px;
  font-size:19px;
}

#studyContent p{
  color:#c6cedb;
}

.quiz-option{
  display:block;
  padding:12px;
  margin:8px 0;
  border:1px solid #273246;
  border-radius:12px;
}

.quiz-option:active{
  background:#182131;
}

.quiz-option input{
  margin-right:8px;
}

.quiz-button{
  width:100%;
  padding:15px;
  border:0;
  border-radius:14px;
  background:#f5f7fb;
  color:#080b12;
  font-weight:bold;
  margin-top:10px;
}

.study-error{
  color:#9ba6b8;
  text-align:center;
  padding:30px 10px;
}

.loading{
  color:#8d97a8;
  text-align:center;
  padding:30px;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">MiniAI Study</div>
  <div class="status" id="status">
    Loading...
  </div>
</header>

<nav id="studyNav">

  <button onclick="showStudySection('chat')">
    AI
  </button>

  <button onclick="showStudySection('study')">
    Study
  </button>

</nav>

<main id="chat">

  <div class="empty" id="empty">

    <div>

      <h1>MiniAI</h1>

      <p>
        Your personal study assistant.
        <br>
        Ask questions or open Study Mode.
      </p>

    </div>

  </div>

</main>

<section
  id="study"
  style="display:none;"
>

  <h1 id="studyTitle">
    Study
  </h1>

  <div id="studyContent">

    <div class="loading">
      Loading study material...
    </div>

  </div>

</section>

<div class="input-area">

  <textarea
    id="input"
    rows="1"
    placeholder="Ask MiniAI something..."
  ></textarea>

  <button
    id="send"
    disabled
  >
    ↑
  </button>

</div>

</div>

<script>

let session = null;

let stoi = {};

let itos = {};

let modelConfig = null;

const UNK = "<UNK>";

const MAX_INPUT_TOKENS = 48;

const MAX_GENERATED_TOKENS = 60;

const TEMPERATURE = 0.85;

const TOP_K = 20;

let chat =
  document.getElementById("chat");

let input =
  document.getElementById("input");

let send =
  document.getElementById("send");

let statusText =
  document.getElementById("status");

let empty =
  document.getElementById("empty");


/* ============================================================
   TOKENIZER
   ============================================================ */

function tokenize(text){

  return text
    .toLowerCase()
    .match(/\w+|[^\w\s]/g) || [];

}


/* ============================================================
   LOAD VOCABULARY
   ============================================================ */

async function loadVocabulary(){

  const response =
    await fetch("vocab.json");

  if(!response.ok){

    throw new Error(
      "vocab.json could not be loaded."
    );

  }

  const data =
    await response.json();

  stoi =
    data.stoi || {};

  itos =
    data.itos || {};

}


/* ============================================================
   LOAD CONFIG
   ============================================================ */

async function loadConfig(){

  const response =
    await fetch("model_config.json");

  if(!response.ok){

    throw new Error(
      "model_config.json could not be loaded."
    );

  }

  modelConfig =
    await response.json();

}


/* ============================================================
   LOAD MODEL
   ============================================================ */

async function loadModel(){

  if(typeof ort === "undefined"){

    throw new Error(
      "ONNX Runtime failed to load."
    );

  }

  ort.env.wasm.wasmPaths = "./";

  session =
    await ort.InferenceSession.create(
      "model.onnx",
      {
        executionProviders:["wasm"],
        graphOptimizationLevel:"all"
      }
    );

}


/* ============================================================
   LOAD STUDY DATA
   ============================================================ */

async function loadStudyMaterial(){

  try{

    const response =
      await fetch(
        "study_data.json"
      );

    if(!response.ok){

      throw new Error(
        "Study data unavailable."
      );

    }

    const data =
      await response.json();

    window.MiniAIStudyData =
      data;

    if(
      document.getElementById(
        "study"
      ).style.display !== "none"
    ){

      renderStudy();

    }

    return data;

  }catch(error){

    console.log(
      "Study data unavailable:",
      error
    );

    window.MiniAIStudyData =
      null;

    return null;

  }

}


/* ============================================================
   INITIALIZE
   ============================================================ */

async function initialize(){

  try{

    statusText.textContent =
      "Loading vocabulary...";

    await loadVocabulary();

    statusText.textContent =
      "Loading neural brain...";

    await loadConfig();

    await loadModel();

    await loadStudyMaterial();

    const vocabularySize =
      Object.keys(stoi).length;

    statusText.textContent =
      "Brain ready • " +
      vocabularySize.toLocaleString() +
      " tokens";

    send.disabled = false;

    input.focus();

  }catch(error){

    console.error(error);

    statusText.textContent =
      "Brain failed to load";

    await loadStudyMaterial();

    addMessage(
      "The study system is available, but the neural model could not be loaded.",
      "ai"
    );

  }

}


/* ============================================================
   SOFTMAX
   ============================================================ */

function softmax(values){

  const max =
    Math.max(...values);

  const exponentials =
    values.map(
      value =>
        Math.exp(
          value - max
        )
    );

  const sum =
    exponentials.reduce(
      (a,b) => a + b,
      0
    );

  return exponentials.map(
    value =>
      value / sum
  );

}


/* ============================================================
   RANDOM SAMPLE
   ============================================================ */

function sample(probabilities){

  const random =
    Math.random();

  let cumulative = 0;

  for(
    let i = 0;
    i < probabilities.length;
    i++
  ){

    cumulative +=
      probabilities[i];

    if(
      random <= cumulative
    ){

      return i;

    }

  }

  return probabilities.length - 1;

}


/* ============================================================
   TOP-K SAMPLE
   ============================================================ */

function topKSample(logits){

  const indexed =
    logits.map(
      (value,index) => ({
        value,
        index
      })
    );

  indexed.sort(
    (a,b) =>
      b.value - a.value
  );

  const selected =
    indexed.slice(
      0,
      Math.min(
        TOP_K,
        indexed.length
      )
    );

  const values =
    selected.map(
      item =>
        item.value /
        TEMPERATURE
    );

  const probabilities =
    softmax(values);

  const selectedIndex =
    sample(probabilities);

  return selected[
    selectedIndex
  ].index;

}


/* ============================================================
   MODEL PREDICTION
   ============================================================ */

async function predict(inputIds){

  if(!session){

    throw new Error(
      "Model is not loaded."
    );

  }

  const blockSize =
    Number(
      modelConfig.block_size
    );

  const unkId =
    Number(
      stoi["<UNK>"] ?? 1
    );

  let context =
    inputIds.slice(
      -blockSize
    );

  if(
    context.length <
    blockSize
  ){

    const padding =
      new Array(
        blockSize -
        context.length
      ).fill(
        unkId
      );

    context =
      padding.concat(
        context
      );

  }

  const tensor =
    new ort.Tensor(
      "int64",
      BigInt64Array.from(
        context,
        Number
      ),
      [
        1,
        blockSize
      ]
    );

  const results =
    await session.run({
      input_ids:
        tensor
    });

  const output =
    results.logits;

  const vocabularySize =
    output.dims[
      output.dims.length - 1
    ];

  const lastPosition =
    blockSize - 1;

  const start =
    lastPosition *
    vocabularySize;

  return Array.from(
    output.data.slice(
      start,
      start +
      vocabularySize
    )
  );

}


/* ============================================================
   GENERATE ANSWER
   ============================================================ */

async function generateAnswer(question){

  if(!session){

    return "My neural brain isn't ready yet.";

  }

  const words =
    tokenize(question);

  if(!words.length){

    return "Please ask me something.";

  }

  let ids =
    words.map(
      word =>
        stoi[word] ??
        stoi[UNK]
    );

  ids =
    ids.filter(
      id =>
        Number.isInteger(id)
    );

  if(!ids.length){

    return "I don't recognize those words yet.";

  }

  ids =
    ids.slice(
      -MAX_INPUT_TOKENS
    );

  const generated = [];

  for(
    let i = 0;
    i < MAX_GENERATED_TOKENS;
    i++
  ){

    const logits =
      await predict(
        ids
      );

    const nextId =
      topKSample(
        logits
      );

    ids.push(
      nextId
    );

    const token =
      itos[String(nextId)];

    if(
      !token ||
      token === "<PAD>"
    ){

      continue;

    }

    generated.push(
      token
    );

    if(
      generated.length >= 8 &&
      [
        ".",
        "!",
        "?"
      ].includes(token)
    ){

      break;

    }

  }

  return formatTokens(
    generated
  );

}


/* ============================================================
   FORMAT TOKENS
   ============================================================ */

function formatTokens(tokens){

  let result = "";

  for(
    const token of tokens
  ){

    if(
      [
        ".",
        ",",
        "!",
        "?",
        ";",
        ":"
      ].includes(token)
    ){

      result += token;

    }else{

      if(result.length){

        result += " ";

      }

      result += token;

    }

  }

  if(!result.length){

    return "I couldn't generate an answer.";

  }

  return (
    result.charAt(0).toUpperCase() +
    result.slice(1)
  );

}


/* ============================================================
   ADD CHAT MESSAGE
   ============================================================ */

function addMessage(
  text,
  type
){

  if(empty){

    empty.remove();

    empty = null;

  }

  const message =
    document.createElement(
      "div"
    );

  message.className =
    "message " + type;

  message.textContent =
    text;

  chat.appendChild(
    message
  );

  chat.scrollTop =
    chat.scrollHeight;

}


/* ============================================================
   SEND MESSAGE
   ============================================================ */

async function sendMessage(){

  const text =
    input.value.trim();

  if(
    !text ||
    !session
  ){

    return;

  }

  addMessage(
    text,
    "user"
  );

  input.value = "";

  input.style.height =
    "auto";

  send.disabled = true;

  try{

    const answer =
      await generateAnswer(
        text
      );

    addMessage(
      answer,
      "ai"
    );

  }catch(error){

    console.error(
      error
    );

    addMessage(
      "Something went wrong while generating the response.",
      "ai"
    );

  }

  send.disabled = false;

  input.focus();

}


/* ============================================================
   NAVIGATION
   ============================================================ */

function showStudySection(section){

  const study =
    document.getElementById(
      "study"
    );

  const inputArea =
    document.querySelector(
      ".input-area"
    );

  if(section === "study"){

    chat.style.display =
      "none";

    study.style.display =
      "block";

    inputArea.style.display =
      "none";

    renderStudy();

  }else{

    chat.style.display =
      "block";

    study.style.display =
      "none";

    inputArea.style.display =
      "flex";

  }

}


/* ============================================================
   RENDER STUDY
   ============================================================ */

function renderStudy(){

  const data =
    window.MiniAIStudyData;

  const title =
    document.getElementById(
      "studyTitle"
    );

  const container =
    document.getElementById(
      "studyContent"
    );

  if(!data){

    title.textContent =
      "Study";

    container.innerHTML = `
      <div class="study-error">
        No study material is available yet.
        <br><br>
        Add material to study_input.txt
        and let GitHub generate the study data.
      </div>
    `;

    return;

  }

  title.textContent =
    data.title ||
    "Study";


  let html = "";


  /* KEY POINTS */

  html += `
    <h2>Key Points</h2>
  `;

  if(
    data.key_points &&
    data.key_points.length
  ){

    html += `
      <div class="study-card">
    `;

    for(
      const point of data.key_points
    ){

      html += `
        <p>
          • ${escapeStudyHTML(point)}
        </p>
      `;

    }

    html += `
      </div>
    `;

  }else{

    html += `
      <div class="study-card">
        <p>No key points available.</p>
      </div>
    `;

  }


  /* FLASHCARDS */

  html += `
    <h2>Flashcards</h2>
  `;

  if(
    data.flashcards &&
    data.flashcards.length
  ){

    for(
      const card of data.flashcards
    ){

      html += `
        <div class="study-card">

          <strong>
            ${escapeStudyHTML(
              card.front
            )}
          </strong>

          <p>
            ${escapeStudyHTML(
              card.back
            )}
          </p>

        </div>
      `;

    }

  }else{

    html += `
      <div class="study-card">
        <p>No flashcards available.</p>
      </div>
    `;

  }


  /* QUESTIONS */

  html += `
    <h2>Questions</h2>
  `;

  if(
    data.questions &&
    data.questions.length
  ){

    for(
      const question of data.questions
    ){

      html += `
        <div class="study-card">

          <strong>
            ${escapeStudyHTML(
              question.question
            )}
          </strong>

          <p>
            ${escapeStudyHTML(
              question.answer
            )}
          </p>

        </div>
      `;

    }

  }else{

    html += `
      <div class="study-card">
        <p>No questions available.</p>
      </div>
    `;

  }


  /* QUIZ */

  html += `
    <h2>Quiz</h2>

    <div id="quizContainer">
      <div class="loading">
        Preparing quiz...
      </div>
    </div>
  `;

  container.innerHTML =
    html;

  renderQuiz(
    data.quiz || []
  );

}


/* ============================================================
   RENDER QUIZ
   ============================================================ */

function renderQuiz(
  questions
){

  const container =
    document.getElementById(
      "quizContainer"
    );

  if(!questions.length){

    container.innerHTML = `
      <div class="study-card">
        <p>No quiz questions available.</p>
      </div>
    `;

    return;

  }

  let html = "";

  questions.forEach(
    (question,index) => {

      html += `
        <div class="study-card">

          <strong>
            ${index + 1}.
            ${escapeStudyHTML(
              question.question
            )}
          </strong>
      `;

      question.options.forEach(
        option => {

          html += `
            <label class="quiz-option">

              <input
                type="radio"
                name="quiz-${index}"
                value="${escapeAttribute(
                  option
                )}"
              >

              ${escapeStudyHTML(
                option
              )}

            </label>
          `;

        }
      );

      html += `
        </div>
      `;

    }
  );

  html += `
    <button
      class="quiz-button"
      onclick="checkQuiz()"
    >
      Check Answers
    </button>

    <div
      id="quizResult"
      style="margin-top:20px;"
    ></div>
  `;

  container.innerHTML =
    html;

}


/* ============================================================
   CHECK QUIZ
   ============================================================ */

function checkQuiz(){

  const data =
    window.MiniAIStudyData;

  if(
    !data ||
    !data.quiz
  ){

    return;

  }

  let score = 0;

  data.quiz.forEach(
    (question,index) => {

      const selected =
        document.querySelector(
          `input[name="quiz-${index}"]:checked`
        );

      if(
        selected &&
        selected.value.toLowerCase() ===
        String(
          question.answer
        ).toLowerCase()
      ){

        score++;

      }

    }
  );

  const result =
    document.getElementById(
      "quizResult"
    );

  const total =
    data.quiz.length;

  let message =
    "Review the material and try again.";

  if(score === total){

    message =
      "Excellent! Perfect score.";

  }else if(
    score >= total * 0.7
  ){

    message =
      "Good work. Review the missed questions.";

  }else if(
    score >= total * 0.5
  ){

    message =
      "You're getting there. Revise once more.";

  }

  result.innerHTML = `
    <div class="study-card">

      <h2>
        Score: ${score}/${total}
      </h2>

      <p>
        ${message}
      </p>

    </div>
  `;

}


/* ============================================================
   HTML SAFETY
   ============================================================ */

function escapeStudyHTML(
  value
){

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


function escapeAttribute(
  value
){

  return String(value)
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    );

}


/* ============================================================
   EVENTS
   ============================================================ */

send.addEventListener(
  "click",
  sendMessage
);

input.addEventListener(
  "keydown",
  event => {

    if(
      event.key === "Enter" &&
      !event.shiftKey
    ){

      event.preventDefault();

      sendMessage();

    }

  }
);

input.addEventListener(
  "input",
  () => {

    input.style.height =
      "auto";

    input.style.height =
      Math.min(
        input.scrollHeight,
        130
      ) + "px";

  }
);


/* ============================================================
   START
   ============================================================ */

initialize();

</script>

</body>
</html>
